<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FUTENT AI · Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="CSS/style.css" />
</head>
<body>
  <div class="cinematic-bg"><div class="glow"></div><div class="glow"></div></div>
  <div id="toast-container"></div>

  <div class="auth-wrapper">
    <div class="auth-card" id="login-form">
      <h2>Welcome to <span>FUTENT AI</span></h2>
      <p class="subtitle">Sign in to continue</p>

      <div class="form-group">
        <label>Special Login Code</label>
        <input type="text" class="auth-input" id="loginCode" placeholder="e.g. A7X9Z" maxlength="5" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" class="auth-input" id="loginPassword" placeholder="••••••••" />
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" class="auth-input" id="loginPhone" placeholder="+1234567890" />
      </div>

      <button class="auth-btn" id="loginBtn"><i class="fas fa-arrow-right"></i> Sign In</button>
      <div class="auth-switch">New user? <a href="register.html">Register here</a></div>
    </div>
  </div>

  <script src="JS/script.js"></script>
</body>
</html>
