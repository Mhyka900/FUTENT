<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FUTENT AI · Settings</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="CSS/style.css" />
</head>
<body id="settingsPage">
  <div class="cinematic-bg"><div class="glow"></div><div class="glow"></div></div>
  <div id="toast-container"></div>

  <header class="nav is-scrolled">
    <div class="nav__inner container">
      <a href="chat.html" class="nav__brand"><i class="fas fa-arrow-left"></i> Back to Chat</a>
      <div class="nav__actions">
        <a href="index.html" class="btn btn--ghost">Home</a>
      </div>
    </div>
  </header>

  <div class="settings-container">
    <h1 style="margin-bottom: 2rem;">Settings</h1>

    <!-- Profile Section -->
    <div class="settings-row" style="border-bottom: 2px solid var(--surface-glass-border); padding-bottom: 2rem;">
      <div style="display: flex; align-items: center; gap: 20px;">
        <div class="avatar" id="profileAvatar" style="width: 60px; height: 60px; font-size: 1.5rem; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900;"></div>
        <div>
          <h4 id="profileName" style="font-size: 1.3rem;">Student</h4>
          <p>FUTENT AI Member</p>
        </div>
      </div>
    </div>

    <!-- Theme Toggle -->
    <div class="settings-row">
      <div>
        <h4>Theme Preference</h4>
        <p>Switch between Dark and Light mode</p>
      </div>
      <button class="theme-toggle" id="themeBtn"><i class="fas fa-adjust"></i> Toggle Theme</button>
    </div>

    <!-- Terms Link -->
    <div class="settings-row">
      <div>
        <h4>Legal</h4>
        <p>Read our platform rules</p>
      </div>
      <a href="terms.html" class="theme-toggle" style="text-decoration: none; display: inline-block;">View T&C</a>
    </div>

    <!-- Logout -->
    <div class="settings-row">
      <div>
        <h4>Session</h4>
        <p>Log out of your account securely</p>
      </div>
      <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Log Out</button>
    </div>
  </div>

  <script src="JS/script.js"></script>
</body>
</html>
