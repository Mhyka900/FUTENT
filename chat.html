<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FUTENT AI · Chat Interface</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="CSS/style.css" />
</head>
<body style="overflow: hidden;">
  <div class="cinematic-bg"><div class="glow"></div><div class="glow"></div></div>
  <div id="toast-container"></div>

  <div class="top-banner">
    <div class="avatar" id="avatarDisplay">U</div>
    <h1>FUTENT AI</h1>
    <button class="menu-btn" id="menuToggle"><i class="fas fa-bars"></i></button>
  </div>

  <div class="dropdown-menu" id="dropdownMenu">
    <a href="chat.html" onclick="window.location.reload()"><i class="fas fa-plus-circle"></i> New Chat</a>
    <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
    <a href="terms.html"><i class="fas fa-file-contract"></i> Terms</a>
  </div>

  <div class="chat-layout">
    <div class="chat-messages" id="chatMessages">
      <div style="text-align: center; margin-top: 10vh; color: var(--paper-dim);">
        <h2 style="color: var(--paper); margin-bottom: 1rem;">Hi there 👋</h2>
        <p style="margin-bottom: 2rem;">What are we studying today?</p>
        <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;">
          <div class="suggestion-card btn btn--secondary" style="border-radius: 20px;">📚 Summarize lecture notes</div>
          <div class="suggestion-card btn btn--secondary" style="border-radius: 20px;">✍️ Find past questions</div>
          <div class="suggestion-card btn btn--secondary" style="border-radius: 20px;">💡 Explain a concept</div>
        </div>
      </div>
      
      <div id="messagesContainer"></div>
      
      <div id="typingIndicator" style="display:none; padding: 1rem; color: var(--primary-light); font-weight:800;">
        <i class="fas fa-circle-notch fa-spin"></i> AI is thinking...
      </div>
    </div>

    <div class="chat-input-area">
      <div class="input-wrap">
        <button onclick="showToast('📎 Attachments coming soon')" style="padding: 0 1rem; color: var(--paper-dim);"><i class="fas fa-paperclip"></i></button>
        <textarea id="chatInput" rows="1" placeholder="Ask anything about your courses..."></textarea>
        <button class="send-btn" onclick="sendMessage()"><i class="fas fa-arrow-up"></i></button>
      </div>
    </div>
  </div>

  <script src="JS/script.js"></script>
</body>
</html>
